name: Rufzeichenliste aktualisieren

on:
  schedule:
    - cron: '0 3 * * 0'  # Sonntags 03:00 UTC
  workflow_dispatch:      # Manuell auslösbar

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Rufzeichenliste laden und parsen
        run: node scripts/fetch-callsigns.mjs

      - name: Änderungen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/callsigns.json
          git diff --staged --quiet && echo "Keine Änderungen." || (
            git commit -m "chore: Rufzeichenliste aktualisiert ($(date -u '+%Y-%m-%d')) [skip ci]"
            git push
          )
