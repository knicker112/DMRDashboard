name: Build & Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  # Läuft NICHT für den automatischen Version-Bump-Commit (verhindert Endlosschleife)
  bump:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag:     ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Patch-Version erhöhen
        id: bump
        run: |
          npm version patch --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION"    >> $GITHUB_OUTPUT

      - name: Commit & Tag pushen
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: release v${{ steps.bump.outputs.version }} [skip ci]"
          git tag v${{ steps.bump.outputs.version }}
          git push origin master
          git push origin v${{ steps.bump.outputs.version }}

  build-linux:
    needs: bump
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.bump.outputs.version }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Vite einmalig bauen, dann electron-builder für jede Architektur
      - name: Vite Build
        run: npx vite build

      - name: AppImage x64 (Linux / Linux Mint)
        run: npx electron-builder --linux AppImage --x64 --publish never

      - name: AppImage arm64 (Raspberry Pi 4 / 5 / Zero 2 W)
        run: npx electron-builder --linux AppImage --arm64 --publish never

      - name: AppImage armv7l (Raspberry Pi 2 / 3)
        run: npx electron-builder --linux AppImage --armv7l --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: DMR-Dashboard-Linux
          path: |
            release/*.AppImage
            release/latest-linux*.yml

  build-android:
    needs: bump
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.bump.outputs.version }}

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Web-App bauen
        run: npx vite build

      - name: Android-Projekt erzeugen
        run: npx cap add android

      - name: Assets synchronisieren
        run: npx cap sync android

      - name: App-Version in build.gradle setzen
        run: |
          VERSION="${{ needs.bump.outputs.version }}"
          VERSION_CODE=$(echo "$VERSION" | awk -F. '{printf "%d%02d%02d", $1, $2, $3}')
          sed -i "s/versionCode [0-9]*/versionCode $VERSION_CODE/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$VERSION\"/" android/app/build.gradle

      - name: Signing-Keystore einrichten
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks

      - name: Release-Signing in build.gradle konfigurieren
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          cat >> android/app/build.gradle << EOF

          android.signingConfigs {
              releaseKey {
                  keyAlias "${KEY_ALIAS}"
                  keyPassword "${KEY_PASSWORD}"
                  storeFile file("keystore.jks")
                  storePassword "${STORE_PASSWORD}"
              }
          }
          android.buildTypes.release.signingConfig = android.signingConfigs.releaseKey
          EOF

      - name: Gradlew ausführbar machen
        run: chmod +x android/gradlew

      - name: Signierte APK bauen (für direkten Download)
        run: cd android && ./gradlew assembleRelease --no-daemon

      - name: Signiertes AAB bauen (für Play Store)
        run: cd android && ./gradlew bundleRelease --no-daemon

      - name: Artefakte umbenennen
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk \
            "DMR-Dashboard-${{ needs.bump.outputs.version }}.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab \
            "DMR-Dashboard-${{ needs.bump.outputs.version }}.aab"

      - uses: actions/upload-artifact@v4
        with:
          name: DMR-Dashboard-Android
          path: |
            DMR-Dashboard-*.apk
            DMR-Dashboard-*.aab

  build-windows:
    needs: bump
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.bump.outputs.version }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run electron:build:win

      - uses: actions/upload-artifact@v4
        with:
          name: DMR-Dashboard-Windows
          path: |
            release/*.exe
            release/latest.yml

  release:
    needs: [bump, build-linux, build-windows, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Repo auschecken damit wir updates/ einchecken können
      - uses: actions/checkout@v4
        with:
          ref: master
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4

      # Relative Dateinamen in latest.yml auf absolute GitHub-Release-URLs umstellen
      - name: Update-Manifeste auf absolute URLs umstellen
        run: |
          VERSION="${{ needs.bump.outputs.version }}"
          BASE="https://github.com/knicker112/DMRDashboard/releases/download/v${VERSION}"
          sed -i "s|url: DMR-Dashboard|url: ${BASE}/DMR-Dashboard|g" DMR-Dashboard-Windows/latest.yml
          for f in DMR-Dashboard-Linux/latest-linux*.yml; do
            sed -i "s|url: DMR-Dashboard|url: ${BASE}/DMR-Dashboard|g" "$f"
          done

      # Release zuerst: .exe und .AppImage hochladen (unabhängig vom yml-Commit)
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.bump.outputs.version }}
          files: |
            DMR-Dashboard-Linux/*.AppImage
            DMR-Dashboard-Windows/*.exe
            DMR-Dashboard-Android/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # latest.yml ins Repo einchecken (nach Release, damit Download-URLs gültig sind)
      - name: Update-Manifeste ins Repository einchecken
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p updates
          cp DMR-Dashboard-Windows/latest.yml updates/latest.yml
          cp DMR-Dashboard-Linux/latest-linux*.yml updates/
          git add updates/
          git diff --staged --quiet || git commit -m "chore: update manifests v${{ needs.bump.outputs.version }} [skip ci]"
          git pull --rebase origin master
          git push origin master
