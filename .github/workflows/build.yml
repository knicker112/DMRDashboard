name: Build & Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  # Läuft NICHT für den automatischen Version-Bump-Commit (verhindert Endlosschleife)
  bump:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag:     ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Patch-Version erhöhen
        id: bump
        run: |
          npm version patch --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION"    >> $GITHUB_OUTPUT

      - name: Commit & Tag pushen
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: release v${{ steps.bump.outputs.version }} [skip ci]"
          git tag v${{ steps.bump.outputs.version }}
          git push origin master
          git push origin v${{ steps.bump.outputs.version }}

  build-linux:
    needs: bump
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.bump.outputs.version }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Vite einmalig bauen, dann electron-builder für jede Architektur
      - name: Vite Build
        run: npx vite build

      - name: AppImage x64 (Linux / Linux Mint)
        run: npx electron-builder --linux AppImage --x64 --publish never

      - name: AppImage arm64 (Raspberry Pi 4 / 5 / Zero 2 W)
        run: npx electron-builder --linux AppImage --arm64 --publish never

      - name: AppImage armv7l (Raspberry Pi 2 / 3)
        run: npx electron-builder --linux AppImage --armv7l --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: DMR-Dashboard-Linux
          path: |
            release/*.AppImage
            release/latest-linux*.yml

  build-android:
    needs: bump
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.bump.outputs.version }}

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Web-App bauen
        run: npx vite build

      - name: Android-Projekt erzeugen
        run: npx cap add android

      - name: Assets synchronisieren
        run: npx cap sync android

      - name: APK bauen
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: APK umbenennen
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk \
            "DMR-Dashboard-${{ needs.bump.outputs.version }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: DMR-Dashboard-Android
          path: DMR-Dashboard-*.apk

  build-windows:
    needs: bump
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.bump.outputs.version }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run electron:build:win

      - uses: actions/upload-artifact@v4
        with:
          name: DMR-Dashboard-Windows
          path: |
            release/*.exe
            release/latest.yml

  release:
    needs: [bump, build-linux, build-windows, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.bump.outputs.version }}
          files: |
            DMR-Dashboard-Linux/*.AppImage
            DMR-Dashboard-Linux/latest-linux*.yml
            DMR-Dashboard-Windows/*.exe
            DMR-Dashboard-Windows/latest.yml
            DMR-Dashboard-Android/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
