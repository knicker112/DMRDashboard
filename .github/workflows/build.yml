name: Build & Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  # Läuft NICHT für den automatischen Version-Bump-Commit (verhindert Endlosschleife)
  bump:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag:     ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Patch-Version erhöhen
        id: bump
        run: |
          npm version patch --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION"    >> $GITHUB_OUTPUT

      - name: Commit & Tag pushen
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: release v${{ steps.bump.outputs.version }} [skip ci]"
          git tag v${{ steps.bump.outputs.version }}
          git push origin master
          git push origin v${{ steps.bump.outputs.version }}

  build-linux:
    needs: bump
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.bump.outputs.version }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run electron:build:linux

      - uses: actions/upload-artifact@v4
        with:
          name: DMR-Dashboard-Linux
          path: |
            release/*.AppImage
            release/latest-linux.yml

  build-windows:
    needs: bump
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.bump.outputs.version }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run electron:build:win

      - uses: actions/upload-artifact@v4
        with:
          name: DMR-Dashboard-Windows
          path: |
            release/*.exe
            release/latest.yml

  release:
    needs: [bump, build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.bump.outputs.version }}
          files: |
            DMR-Dashboard-Linux/*.AppImage
            DMR-Dashboard-Linux/latest-linux.yml
            DMR-Dashboard-Windows/*.exe
            DMR-Dashboard-Windows/latest.yml
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
